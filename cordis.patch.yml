# XWork 宿主层补丁：围绕官方 Web bundle 组合 XWork 桌面子插件。
# 兼容模式保持上游对浏览器载体与渲染 UI 的所有权。

# XWork 桌面外壳行：宿主进程通过模块解析钩子把 `xwork-for-dsh` 解析到
# 本包编译出的 xwork-shell 入口（src/main/xwork-shell.ts → out/main/xwork-shell.js）。
- insert:
    - id: xwork-shell
      name: xwork-for-dsh
      config: {}

# in-box UI 优化插件（plugins/UI Optimization）：随宿主层自动装载。
# 模块解析钩子把 `ui-optimization` 映射到该项目内源插件；配置可通过设置页
# 「UI Optimization」页签交互修改（持久化到 settings 文档），此处仅给默认空配置。
- insert:
    - id: ui-optimization
      name: ui-optimization
      config: {}

# XWork 桌面启动没有等待 Web 就绪行的终端操作员：不打印 URL 行、
# 不交给系统浏览器（openBrowser 默认 true，必须显式关掉）。
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: []
